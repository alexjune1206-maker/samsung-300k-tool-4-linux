name: Bug Report
description: Report a problem with samsung-300k-tool
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Output of `./samsung-300k-tool --version`
      placeholder: "e.g. 1.2.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      description: Samsung model (e.g. SM-G950F, SM-G386F)
      placeholder: "e.g. SM-G950F"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behavior you saw
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Copy-paste the terminal output. It will be formatted as code automatically.
      render: shell
    validations:
      required: false
